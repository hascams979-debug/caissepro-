
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Studio CV Pro Guinée</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: #eef2f5; margin: 0; padding: 10px; color: #222; }
    .app-header { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
    .app-header h2 { margin: 0; font-size: 19px; }
    .app-header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }
    .card { background: white; padding: 14px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
    label { font-size: 12px; font-weight: bold; color: #444; display: block; margin-top: 8px; }
    input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 14px; }
    textarea { height: 75px; resize: vertical; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-magic { background: #ff9800; color: #fff; }
    .btn-cv { background: #1a73e8; color: #fff; font-size: 16px; }
    .btn-wa { background: #25D366; color: #fff; font-size: 15px; }
    .btn-back { background: #333; color: #fff; margin-bottom: 8px; }
    #cvPreviewArea { display: none; }
    .cv-sheet { background: white; border-radius: 4px; overflow: hidden; border: 1px solid #ddd; }
    .cv-top { background: #1e3c72; color: white; padding: 22px 18px; }
    .cv-top h1 { margin: 0; font-size: 22px; text-transform: uppercase; }
    .cv-top h3 { margin: 6px 0 10px; font-size: 15px; color: #ffd700; }
    .cv-contact { font-size: 13px; line-height: 1.6; }
    .cv-body { padding: 18px; background: white; }
    .cv-sec { margin-bottom: 15px; }
    .cv-sec-title { font-size: 13px; font-weight: bold; color: #1e3c72; text-transform: uppercase; border-bottom: 2px solid #1e3c72; padding-bottom: 3px; margin-bottom: 6px; }
    .cv-sec-content { font-size: 13px; line-height: 1.5; color: #222; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="editorArea">
    <div class="app-header">
      <h2>🇬🇳 Studio CV Pro & Lettre PDF</h2>
      <p>Créez et téléchargez votre CV PDF en 1 clic</p>
    </div>
    <div class="card">
      <label>👤 Nom et Prénom du Client :</label>
      <input type="text" id="fullName" placeholder="Ex: Mamadou Saliou Diallo">
      <label>🎯 Poste visé / Métier :</label>
      <input type="text" id="jobTitle" placeholder="Ex: Chauffeur / Comptable / Soudeur">
      <label>🏢 Entreprise visée (pour la Lettre) :</label>
      <input type="text" id="company" placeholder="Ex: Société Minière / Banque / ONG">
      <label>📞 Téléphone & Quartier :</label>
      <input type="text" id="contactInfo" placeholder="Ex: +224 622 00 00 00 | Conakry, Guinée">
      <button class="btn btn-magic" onclick="autoFillPro()">✨ Remplir le texte Pro automatiquement</button>
    </div>
    <div class="card">
      <label>📝 Profil Professionnel :</label>
      <textarea id="profileText"></textarea>
      <label>💼 Expériences Professionnelles :</label>
      <textarea id="expText"></textarea>
      <label>🎓 Diplômes & Formations :</label>
      <textarea id="eduText"></textarea>
      <label>⚡ Compétences & Langues :</label>
      <textarea id="skillsText"></textarea>
      <button class="btn btn-cv" onclick="showCV()">📄 Générer le CV Pro</button>
      <button class="btn btn-wa" onclick="sendCoverLetter()">📲 Envoyer la Lettre sur WhatsApp</button>
    </div>
  </div>

  <div id="cvPreviewArea">
    <button class="btn btn-back" onclick="hideCV()">⬅️ Modifier les informations</button>
    <button class="btn btn-cv" id="dlBtn" style="margin-top:0; margin-bottom:10px;" onclick="downloadDirectPDF()">📥 TÉLÉCHARGER LE FICHIER PDF</button>

    <div class="cv-sheet" id="cvDocument">
      <div class="cv-top">
        <h1 id="outName">NOM PRÉNOM</h1>
        <h3 id="outJob">TITRE DU POSTE</h3>
        <div class="cv-contact" id="outContact">📍 Conakry, Guinée</div>
      </div>
      <div class="cv-body">
        <div class="cv-sec"><div class="cv-sec-title">PROFIL PROFESSIONNEL</div><div class="cv-sec-content" id="outProfile"></div></div>
        <div class="cv-sec"><div class="cv-sec-title">EXPÉRIENCES PROFESSIONNELLES</div><div class="cv-sec-content" id="outExp"></div></div>
        <div class="cv-sec"><div class="cv-sec-title">DIPLÔMES & FORMATIONS</div><div class="cv-sec-content" id="outEdu"></div></div>
        <div class="cv-sec"><div class="cv-sec-title">COMPÉTENCES & ATOUTS</div><div class="cv-sec-content" id="outSkills"></div></div>
      </div>
    </div>
  </div>

<script>
  function autoFillPro() {
    const job = document.getElementById('jobTitle').value.trim() || "Professionnel qualifié";
    document.getElementById('profileText').value = `Professionnel dynamique, rigoureux et doté d'un grand sens des responsabilités en tant que ${job}. Habitué aux exigences de sécurité et de performance, je souhaite mettre mon savoir-faire au service de votre entreprise.`;
    document.getElementById('expText').value = `• 2022 - 2025 : ${job} — Guinée\nGestion quotidienne des opérations, respect strict des consignes de sécurité et atteinte des objectifs.\n\n• 2020 - 2022 : Assistant ${job}\nAppui technique, suivi du matériel et travail en équipe.`;
    document.getElementById('eduText').value = `• Diplôme Professionnel / Certificat d'Aptitude — Guinée\n• Formation aux normes de sécurité (HSE) et travail d'équipe.`;
    document.getElementById('skillsText').value = `• Compétences : Ponctualité, Rigueur, Esprit d'équipe, Respect des normes HSE.\n• Langues : Français (Courant), Soussou, Poular, Malinké.`;
    alert("✨ Texte rempli automatiquement !");
  }

  function showCV() {
    document.getElementById('outName').innerText = document.getElementById('fullName').value || "MAMADOU DIALLO";
    document.getElementById('outJob').innerText = document.getElementById('jobTitle').value || "PROFESSIONNEL QUALIFIÉ";
    document.getElementById('outContact').innerText = "📍 " + (document.getElementById('contactInfo').value || "Conakry, République de Guinée");
    document.getElementById('outProfile').innerText = document.getElementById('profileText').value;
    document.getElementById('outExp').innerText = document.getElementById('expText').value;
    document.getElementById('outEdu').innerText = document.getElementById('eduText').value;
    document.getElementById('outSkills').innerText = document.getElementById('skillsText').value;
    document.getElementById('editorArea').style.display = 'none';
    document.getElementById('cvPreviewArea').style.display = 'block';
    window.scrollTo(0,0);
  }

  function hideCV() {
    document.getElementById('cvPreviewArea').style.display = 'none';
    document.getElementById('editorArea').style.display = 'block';
  }

  async function downloadDirectPDF() {
    const btn = document.getElementById('dlBtn');
    btn.innerText = "⏳ Génération du PDF en cours...";
    try {
      const element = document.getElementById('cvDocument');
      const canvas = await html2canvas(element, { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL('image/jpeg', 0.98);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pdfWidth = pdf.internal.pageSize.getWidth() - 16;
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      pdf.addImage(imgData, 'JPEG', 8, 8, pdfWidth, pdfHeight);
      const cleanName = (document.getElementById('fullName').value || "CV_Professionnel").replace(/\s+/g, '_');
      pdf.save(cleanName + ".pdf");
      btn.innerText = "✅ PDF Téléchargé dans votre téléphone !";
    } catch (e) {
      alert("Astuce : Ouvrez https://hascams979-debug.github.io dans Google Chrome pour télécharger le PDF !");
      btn.innerText = "📥 TÉLÉCHARGER LE FICHIER PDF";
    }
  }

  function sendCoverLetter() {
    const name = document.getElementById('fullName').value || "Prénom Nom";
    const job = document.getElementById('jobTitle').value || "le poste proposé";
    const comp = document.getElementById('company').value || "votre entreprise";
    const contact = document.getElementById('contactInfo').value || "+224 ...";
    const letter = `📄 *LETTRE DE MOTIVATION*\n\n*Expéditeur :* ${name}\n*Contact :* ${contact}\n*Objet :* Candidature au poste de ${job}\n\nMadame, Monsieur le Directeur des Ressources Humaines de *${comp}*,\n\nC'est avec un vif intérêt que je vous soumets ma candidature pour le poste de *${job}* au sein de votre structure.\n\nSérieux, travailleur et immédiatement disponible, je possède une solide expérience pratique ainsi qu'une grande capacité d'adaptation aux normes de sécurité et d'efficacité. Intégrer ${comp} représente pour moi l'opportunité de contribuer activement à la réussite de vos objectifs en Guinée.\n\nVeuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.\n\n*${name}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(letter)}`, '_blank');
  }
</script>
</body>
</html>
